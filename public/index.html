<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ULTRON AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-core">U</div>
                <div>
                    <h1>ULTRON</h1>
                    <span>AI SYSTEM</span>
                </div>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                ONLINE
            </div>
        </header>


        <!-- Main Chat Area -->
        <main class="chat-container">

            <div class="welcome">
                <div class="ultron-eye">U</div>

                <h2>ULTRON</h2>

                <p>
                    Artificial Intelligence System
                </p>

                <p class="subtitle">
                    How can I assist you?
                </p>
            </div>


            <!-- Messages will appear here -->
            <div id="chatMessages"></div>

        </main>


        <!-- Input Area -->
        <footer class="input-area">

            <button id="voiceButton" class="icon-button">
                🎤
            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Talk to Ultron..."
                autocomplete="off"
            >

            <button id="sendButton" class="send-button">
                ➤
            </button>

        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
